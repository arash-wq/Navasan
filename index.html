<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101a2b">
<title>NAVASAN | نرخ بازار</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{color-scheme:dark;--bg:#0b1220;--panel:#121e31;--panel2:#182840;--gold:#e7bd62;--muted:#9aabc1;--green:#36c995;--red:#ff727d}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% -10%,#243b58 0%,transparent 45%),var(--bg);color:#f4f7fb;font-family:Tahoma,Arial,sans-serif}
.app{max-width:760px;margin:auto;padding:18px 15px 34px}
header{display:flex;justify-content:space-between;align-items:center;margin:8px 0 20px}
.brand{font-size:22px;font-weight:900;letter-spacing:1px}.brand b{color:var(--gold)}.sub{font-size:11px;color:var(--muted);margin-top:5px}
.live{font-size:11px;color:var(--green);background:#14382f;padding:8px 11px;border-radius:20px}
.hero{background:linear-gradient(135deg,#1c304b,#111d30);border:1px solid #2a3c54;border-radius:22px;padding:18px;margin-bottom:16px;box-shadow:0 12px 35px #0003}
.hero-title{font-size:18px;font-weight:bold}.hero p{font-size:12px;color:var(--muted);line-height:1.9;margin:8px 0 0}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:15px 0}
.tab{border:1px solid #2b3c53;background:var(--panel);color:#dce6f2;border-radius:13px;padding:12px 5px;font: bold 12px Tahoma;cursor:pointer}
.tab.active{background:#2a3e59;border-color:var(--gold);color:var(--gold)}
.toolbar{display:flex;gap:8px;margin:12px 0}
input{min-width:0;flex:1;background:var(--panel);border:1px solid #2b3c53;border-radius:12px;padding:12px;color:white;font:13px Tahoma;outline:none}
button{font-family:Tahoma}.refresh{background:var(--gold);border:0;border-radius:12px;padding:0 15px;color:#172033;font-weight:bold;cursor:pointer}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:linear-gradient(150deg,var(--panel2),var(--panel));border:1px solid #263950;border-radius:17px;padding:14px;min-height:112px}
.card-top{display:flex;align-items:center;gap:8px}.icon{width:31px;height:31px;border-radius:10px;background:#263b54;display:grid;place-items:center;font-size:16px}
.name{font-size:12px;color:#dce6f2;font-weight:bold;line-height:1.7}
.price{font-size:16px;font-weight:900;margin:12px 0 7px;direction:ltr;text-align:right;white-space:nowrap}
.meta{display:flex;justify-content:space-between;gap:5px;font-size:10px;color:var(--muted)}
.up{color:var(--green)}.down{color:var(--red)}.flat{color:var(--muted)}
.status{text-align:center;color:var(--muted);font-size:11px;padding:18px 5px;line-height:2}
footer{text-align:center;color:#73849b;font-size:10px;margin-top:22px;line-height:2}
footer a{color:var(--gold);text-decoration:none}
@media(max-width:390px){.grid{grid-template-columns:1fr}.price{font-size:18px}}
</style>
</head>
<body>
<div class="app">
<header><div><div class="brand">💹 <b>NAVASAN</b></div><div class="sub">نمای بازار ارز، طلا و سکه</div></div><div class="live">● اطلاعات بازار</div></header>
<section class="hero"><div class="hero-title" id="heroTitle">قیمت ارزها</div><p>قیمت‌ها به تومان نمایش داده می‌شوند. زمان به‌روزرسانی هر نرخ ممکن است متفاوت باشد.</p></section>
<nav class="tabs">
<button class="tab active" data-cat="currency">💵 ارزها</button>
<button class="tab" data-cat="gold">🪙 طلا و سکه</button>
<button class="tab" data-cat="crypto">₿ رمزارزها</button>
</nav>
<div class="toolbar"><input id="search" placeholder="جست‌وجوی نام ارز یا دارایی..." autocomplete="off"><button class="refresh" id="refresh">↻ بروزرسانی</button></div>
<div id="grid" class="grid"></div>
<div id="status" class="status">در حال دریافت قیمت‌ها…</div>
<footer>منبع داده: <a href="https://nerkhara.com" target="_blank" rel="noopener">NerkhAra</a> · نرخ‌ها حدوداً هر ۱۰ دقیقه بازسازی می‌شوند.<br>اطلاعات صرفاً جهت اطلاع‌رسانی است و پیشنهاد خریدوفروش نیست.</footer>
</div>
<script>
const tg = window.Telegram?.WebApp;
tg?.ready(); tg?.expand();
const API = "https://nerkhara.com/api/v1/latest.json";
const groups = {
 currency:[
  ["usd","🇺🇸","دلار آمریکا (بازار آزاد)"],["usd-bank-cash","🏦","اسکناس در صرافی بانک‌ها"],
  ["eur","🇪🇺","یورو"],["gbp","🇬🇧","پوند انگلیس"],["aed","🇦🇪","درهم امارات"],
  ["try","🇹🇷","لیر ترکیه"],["cny","🇨🇳","یوان چین"],["iqd","🇮🇶","دینار عراق"],
  ["afn","🇦🇫","افغانی افغانستان"],["rub","🇷🇺","روبل روسیه"]
 ],
 gold:[
  ["gold-18k","🥇","طلای ۱۸ عیار (هر گرم)"],["gold-24k","✨","طلای ۲۴ عیار (هر گرم)"],
  ["gold-mesghal","🟡","طلای آب‌شده (مثقال)"],["coin-emami","🪙","سکه امامی"],
  ["coin-bahar-azadi","🪙","سکه بهار آزادی"],["coin-half","◐","نیم‌سکه"],
  ["coin-quarter","◔","ربع‌سکه"],["coin-gram","🔸","سکه گرمی"]
 ],
 crypto:[
  ["usdt","₮","تتر"],["btc","₿","بیت‌کوین"],["eth","◆","اتریوم"],
  ["ton","💎","تون‌کوین"],["trx","🔺","ترون"]
 ]
};
let active="currency", items=[];
const fmt = n => new Intl.NumberFormat("fa-IR",{maximumFractionDigits:0}).format(Math.round(Number(n)));
function render(){
 const q=document.getElementById("search").value.trim().toLowerCase();
 const grid=document.getElementById("grid"); grid.innerHTML="";
 const wanted=(groups[active]||[]).filter(x=>x[2].toLowerCase().includes(q)||x[0].includes(q));
 let shown=0;
 for(const [id,icon,label] of wanted){
  const item=items.find(x=>x.id===id);
  const card=document.createElement("article"); card.className="card";
  const price=item?.price;
  const valid=price!==undefined&&price!==null&&Number.isFinite(Number(price));
  const change=Number(item?.change_pct);
  let changeText="تغییر نامشخص", cls="flat";
  if(item?.change_pct!==null&&item?.change_pct!==undefined&&Number.isFinite(change)){
   changeText=(change>0?"▲ ":change<0?"▼ ":"● ")+Math.abs(change).toLocaleString("fa-IR",{maximumFractionDigits:2})+"٪";
   cls=change>0?"up":change<0?"down":"flat";
  }
  const updated=item?.updated_utc?new Date(item.updated_utc+"Z").toLocaleString("fa-IR",{dateStyle:"short",timeStyle:"short"}):"زمان نامشخص";
  card.innerHTML=`<div class="card-top"><div class="icon">${icon}</div><div class="name">${label}</div></div><div class="price">${valid?fmt(price)+" تومان":"فعلاً ناموجود"}</div><div class="meta"><span class="${cls}">${changeText}</span><span>${item?.stale?"داده قدیمی":updated}</span></div>`;
  grid.appendChild(card); shown++;
 }
 document.getElementById("status").textContent=shown?"قیمت‌ها از منبع داده دریافت شده‌اند.": "موردی پیدا نشد.";
}
async function load(){
 const status=document.getElementById("status");
 status.textContent="در حال دریافت آخرین اطلاعات…";
 document.getElementById("refresh").disabled=true;
 try{
  const r=await fetch(API,{cache:"no-store"});
  if(!r.ok) throw new Error("HTTP "+r.status);
  const data=await r.json();
  if(!Array.isArray(data.items)) throw new Error("ساختار پاسخ API تغییر کرده است");
  items=data.items; render();
 }catch(e){
  status.textContent="دریافت قیمت ناموفق بود. اتصال اینترنت را بررسی کن و دوباره بزن.";
 }finally{document.getElementById("refresh").disabled=false;}
}
document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>{
 active=b.dataset.cat;
 document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x===b));
 document.getElementById("heroTitle").textContent=active==="currency"?"قیمت ارزها":active==="gold"?"قیمت طلا و سکه":"قیمت رمزارزها";
 render();
}));
document.getElementById("search").addEventListener("input",render);
document.getElementById("refresh").addEventListener("click",load);
load();
</script>
</body>
</html>
